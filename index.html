<title>Claude Quest</title><meta name="theme-color" content="#58cc02">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* ============ Tokens ============ */
:root{
  color-scheme: light;
  --bg:#ffffff;
  --bg2:#f7f7f5;
  --card:#ffffff;
  --ink:#3b3a37;
  --ink-strong:#23221f;
  --muted:#7d7a73;
  --line:#e6e4df;
  --line-strong:#d4d1ca;
  --chip:#ffffff;
  --shadow:#dedbd3;
  --overlay:rgba(20,18,14,.45);

  --green:#58cc02; --green-d:#46a302; --green-bg:#d7ffb8; --green-ink:#3e8b00;
  --red:#ff4b4b;   --red-d:#e03a3a;   --red-bg:#ffdfe0;   --red-ink:#d93636;
  --blue:#1cb0f6;  --blue-d:#1899d6;  --blue-bg:#ddf4ff;
  --gold:#ffc800;  --gold-d:#e6a700;  --gold-bg:#fff5d1;
  --flame:#ff9600; --flame-d:#e07f00;
  --purple:#a560f0;--purple-d:#8b46d6;
  --ember:#ff7a3d; --ember-d:#e5602a;
  --locked:#e5e4e0; --locked-d:#c9c7c1; --locked-ink:#afaca5;

  --sec:#58cc02; --sec-d:#46a302;   /* set per section */

  --r-sm:12px; --r:16px; --r-lg:20px;
  --font-display:"Baloo 2", "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --font:"Nunito", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --nav-h:64px;
  --top-h:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#101d22; --bg2:#0c171b; --card:#15262c; --ink:#e8eef0; --ink-strong:#ffffff; --muted:#8fa3ab;
    --line:#26393f; --line-strong:#33494f; --chip:#15262c; --shadow:#0a1417; --overlay:rgba(0,0,0,.6);
    --green-bg:#1f3a12; --green-ink:#79e02a; --red-bg:#3d1c1e; --red-ink:#ff7a7a; --blue-bg:#12303f; --gold-bg:#3a3110;
    --locked:#253a41; --locked-d:#1a2c32; --locked-ink:#56707a;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101d22; --bg2:#0c171b; --card:#15262c; --ink:#e8eef0; --ink-strong:#ffffff; --muted:#8fa3ab;
  --line:#26393f; --line-strong:#33494f; --chip:#15262c; --shadow:#0a1417; --overlay:rgba(0,0,0,.6);
  --green-bg:#1f3a12; --green-ink:#79e02a; --red-bg:#3d1c1e; --red-ink:#ff7a7a; --blue-bg:#12303f; --gold-bg:#3a3110;
  --locked:#253a41; --locked-d:#1a2c32; --locked-ink:#56707a;
}

/* ============ Base ============ */
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;font-weight:600;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--blue)}
h1,h2,h3{font-family:var(--font-display);color:var(--ink-strong);margin:0;line-height:1.15;text-wrap:balance;font-weight:800}
p{margin:0}
code{font-family:var(--mono);font-size:.86em;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:1px 5px;white-space:normal;word-break:break-word}
.tabnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto;position:relative;background:var(--bg)}
@media (min-width:640px){ #app{border-left:2px solid var(--line);border-right:2px solid var(--line)} }

/* ============ Top bar ============ */
.topbar{flex:none;height:var(--top-h);display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:0 14px;border-bottom:2px solid var(--line);background:var(--bg);z-index:5}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-size:17px;padding:6px 8px;border-radius:12px}
.stat:active{background:var(--bg2)}
.stat svg{width:26px;height:26px;flex:none}
.stat.flame{color:var(--flame)} .stat.flame.cold{color:var(--locked-ink)}
.stat.gem{color:var(--blue)} .stat.heart{color:var(--red)} .stat.xp{color:var(--gold-d)}
.course-chip{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:12px;font-weight:800;color:var(--muted);font-size:14px}
.course-chip .dot{width:26px;height:26px;border-radius:8px;background:var(--sec);display:grid;place-items:center;color:#fff}
.course-chip .dot svg{width:17px;height:17px}

/* ============ Main + nav ============ */
.main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative}
.page{padding:18px 16px 40px}
.nav{flex:none;display:flex;justify-content:space-around;align-items:stretch;border-top:2px solid var(--line);background:var(--bg);
  height:calc(var(--nav-h));z-index:5}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:800;
  color:var(--muted);letter-spacing:.02em;text-transform:uppercase;border-radius:12px;margin:6px 2px;border:2px solid transparent}
.nav button svg{width:28px;height:28px}
.nav button[aria-current="page"]{color:var(--blue);background:var(--blue-bg);border-color:#84d8ff}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .nav button[aria-current="page"]{border-color:#1f6f94} }
:root[data-theme="dark"] .nav button[aria-current="page"]{border-color:#1f6f94}

/* ============ Buttons ============ */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:12px 18px;border-radius:16px;
  font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--green);
  box-shadow:0 4px 0 var(--green-d);transition:transform .06s, box-shadow .06s, filter .15s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-d)}
.btn:disabled{background:var(--locked);color:var(--locked-ink);box-shadow:0 4px 0 var(--locked-d);cursor:default}
.btn:disabled:active{transform:none}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d);color:#5a4300}
.btn.purple{background:var(--purple);box-shadow:0 4px 0 var(--purple-d)}
.btn.sec{background:var(--sec);box-shadow:0 4px 0 var(--sec-d)}
.btn.ghost{background:var(--card);color:var(--blue);box-shadow:0 4px 0 var(--line-strong);border:2px solid var(--line-strong)}
.btn.ghost.plain{color:var(--muted)}
.btn.small{min-height:40px;font-size:13px;padding:8px 14px;border-radius:13px;width:auto}
.linkbtn{color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:14px;padding:10px}

/* ============ Path ============ */
.section-head{margin:6px 0 14px;padding:14px 16px;border-radius:var(--r);background:var(--bg2);border:2px solid var(--line);display:flex;gap:12px;align-items:center}
.section-head .num{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.section-head h2{font-size:22px}
.section-head .meta{font-size:13px;color:var(--muted);margin-top:2px}
.section-head .ring{flex:none;margin-left:auto}
.unit-banner{position:sticky;top:0;z-index:3;margin:0 -16px 8px;padding:10px 16px 12px;background:var(--bg)}
.unit-card{border-radius:var(--r);background:var(--sec);color:#fff;padding:14px 14px 14px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 0 var(--sec-d)}
.unit-card .eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.unit-card h3{color:#fff;font-size:19px;margin-top:2px}
.unit-card .src{font-size:12.5px;opacity:.9;margin-top:3px;font-weight:700}
.unit-card .gb{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid rgba(255,255,255,.45);border-radius:14px;padding:8px 10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:rgba(255,255,255,.12)}
.unit-card .gb svg{width:22px;height:22px}
.unit-card.locked{background:var(--locked);color:var(--locked-ink);box-shadow:0 4px 0 var(--locked-d)}
.unit-card.locked h3{color:var(--muted)}
.unit-card.locked .gb{border-color:var(--line-strong);color:var(--muted);background:transparent}
.jump{display:flex;justify-content:center;margin:2px 0 6px}
.jump button{font-size:13px;font-weight:800;color:var(--sec-d);border:2px solid var(--line-strong);border-radius:12px;padding:6px 12px;text-transform:uppercase;letter-spacing:.06em;background:var(--card);box-shadow:0 3px 0 var(--line-strong)}
.jump button:active{transform:translateY(3px);box-shadow:none}
.path{position:relative;padding:58px 0 34px;display:flex;flex-direction:column;align-items:center;gap:18px}
.node-wrap.is-current .node.chest{animation:wiggle 1.6s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-8deg)}20%{transform:rotate(8deg)}30%{transform:rotate(-5deg)}40%{transform:rotate(0)}}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node-wrap.is-current{z-index:2;margin-top:26px}
.node-wrap.has-pop{z-index:10}
.node{width:72px;height:66px;border-radius:50%;display:grid;place-items:center;background:var(--sec);box-shadow:0 7px 0 var(--sec-d);color:#fff;position:relative;transition:transform .08s}
.node svg{width:34px;height:34px}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 var(--sec-d)}
.node.locked{background:var(--locked);box-shadow:0 7px 0 var(--locked-d);color:var(--locked-ink)}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d);color:#fff}
.node.skipped{background:var(--gold-bg);box-shadow:0 7px 0 var(--gold-d);color:var(--gold-d);border:3px dashed var(--gold-d)}
.node.legend{background:var(--purple);box-shadow:0 7px 0 var(--purple-d)}
.node.chest,.node.chest.locked{background:transparent;box-shadow:none;width:76px;height:70px}
.node.chest svg{width:64px;height:58px}
.node.chest:active{transform:translateY(3px)}
.node-ring{position:absolute;inset:-12px;pointer-events:none}
.start-tip{position:absolute;top:-46px;left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--line-strong);color:var(--sec-d);
  font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:14px;padding:6px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.4s ease-in-out infinite;pointer-events:none}
.start-tip::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--card);border-right:2px solid var(--line-strong);border-bottom:2px solid var(--line-strong);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
.pip-side{position:absolute;width:96px;height:96px;pointer-events:none}
.popover{position:absolute;top:84px;left:50%;transform:translateX(calc(-50% - var(--off,0px)));width:min(300px,86vw);background:var(--sec);color:#fff;border-radius:var(--r);padding:14px;z-index:4;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.popover.locked{background:var(--card);color:var(--ink);border:2px solid var(--line-strong)}
.popover::before{content:"";position:absolute;top:-8px;left:calc(50% + var(--off,0px));width:16px;height:16px;background:inherit;transform:translateX(-50%) rotate(45deg);border-left:inherit;border-top:inherit}
.popover h4{margin:0 0 4px;font-size:17px;font-family:var(--font-display);font-weight:800}
.popover p{font-size:14px;opacity:.92;margin-bottom:12px}
.popover .btn{background:#fff;color:var(--sec-d);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.popover.locked .btn{background:var(--locked);color:var(--locked-ink);box-shadow:0 4px 0 var(--locked-d)}
.path-end{text-align:center;color:var(--muted);padding:30px 10px 60px;font-size:14px}

/* ============ Lesson ============ */
.lesson{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.lesson-top{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px 8px}
.lesson-top .x{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:10px}
.lesson-top .x svg{width:26px;height:26px}
.bar{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .35s cubic-bezier(.3,1.4,.6,1);position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.lesson-top .hearts{display:flex;align-items:center;gap:4px;color:var(--red);font-weight:800;font-size:17px}
.lesson-top .hearts svg{width:26px;height:26px}
.lesson-top .timer{font-weight:800;color:var(--blue);font-size:17px;min-width:44px;text-align:right}
.combo{height:0;position:relative}
.combo span{position:absolute;left:16px;top:-2px;font-weight:800;font-size:13px;color:var(--flame);text-transform:uppercase;letter-spacing:.06em;animation:popin .4s ease}
.lesson-body{flex:1;overflow-y:auto;padding:10px 16px 20px;display:flex;flex-direction:column}
.q-kind{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--purple);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.q-kind.new{color:var(--purple)} .q-kind.hard{color:var(--red-ink)} .q-kind.redo{color:var(--flame)}
.q-title{font-size:22px;margin-bottom:16px;line-height:1.25}
.q-sub{color:var(--muted);font-size:15px;margin:-8px 0 14px}
.opts{display:flex;flex-direction:column;gap:10px}

/* Content DSL. Every lesson is a list of items.
   T  = teach card          (title, body)
   MC = multiple choice     (question, [correct, wrong...], why)
   TF = true / false        (statement, true|false, why)
   FB = fill the blank      ("text with ___", [correct, wrong...], why)
   ORD= put in order        (question, [steps in the right order], why)
   MATCH = match pairs      (question, [[left,right],...], why)
   MS = select all that apply (question, [right...], [wrong...], why)
   BUILD = build a sentence (question, "correct sentence", [extra words], why)

S({

  desc: 'What AI is, what it can and cannot do, and how to work with it well.',
  units: [
    {
      id: 'u-aiff1', title: 'AI Fluency: the basics', course: 'aiff',
      lessons: [
        L('aiff-1', 'Introduction to AI Fluency', 'introduction-to-ai-fluency', [
          T('What is AI Fluency?', 'AI Fluency is the ability to work **with** AI in ways that are:\n- **effective** (you get good results)\n- **efficient** (you save time and effort)\n- **ethical** (you are honest and fair)\n- **safe** (you avoid harm)'),
          MC('AI Fluency means working with AI in ways that are…', ['Effective, efficient, ethical and safe', 'Fast, cheap, secret and automatic', 'Technical, complex and code-based', 'Creative only'], 'These four words are the core definition of AI Fluency.'),
          T('Who made the framework?', 'The AI Fluency Framework was created by **Prof. Rick Dakan** (Ringling College of Art and Design) and **Prof. Joseph Feller** (University College Cork), together with Anthropic.\nIt is not about one tool. It is about **skills that stay useful** even when AI tools change.'),
          TF('AI Fluency is mainly about learning the buttons of one AI app.', false, 'It is about lasting skills and ways of thinking, not one app. Tools change; the skills stay.'),
          MC('Why does the framework focus on skills and not on one product?', ['AI tools change fast, but good habits stay useful', 'Because products are illegal to teach', 'Because skills are easier to sell', 'Because AI will stop changing soon'], 'The framework is built to stay relevant as AI systems evolve.'),
          FB('AI Fluency is about working ___ AI, not just using it like a vending machine.', ['with', 'against', 'without'], 'The idea is collaboration: you and AI work together.'),
          MATCH('Match each word to its meaning', [['Effective', 'Good results'], ['Efficient', 'Less time and effort'], ['Ethical', 'Honest and fair'], ['Safe', 'Avoids harm']], 'These are the four goals of AI Fluency.'),
        ]),
        L('aiff-2', 'Why do we need AI Fluency?', 'why-do-we-need-ai-fluency', [
          T('AI is a new kind of partner', 'Old software does exactly what you click. Generative AI is different: it **understands language**, can **create** new content and can act like a **collaborator**.\nThis gives big chances, but also new risks. So we need new skills.'),
          T('Three ways to work with AI', 'The course names three modes:\n- **Automation**: AI does a specific task you describe.\n- **Augmentation**: you and AI think and create **together**.\n- **Agency**: you set up AI to **act on its own**, doing future tasks for you or for others.'),
          MATCH('Match the mode to the example', [['Automation', 'Translate this email to Spanish'], ['Augmentation', 'Brainstorm a plan together'], ['Agency', 'A bot that answers customers for you']], 'Automation = do a task; Augmentation = think together; Agency = AI acts independently later.'),
          MC('You and Claude go back and forth to shape a business idea. Which mode is this?', ['Augmentation', 'Automation', 'Agency', 'Isolation'], 'Working together as thinking partners is augmentation.'),

          FB('Summarize this report in 5 bullet points is an example of ___.', ['automation', 'agency', 'augmentation'], 'A clear, specific task handed to AI is automation.'),

          T('What is generative AI?', 'Generative AI **creates new content**: text, images, code and more.\nTools like Claude are **large language models** (LLMs). They learned patterns from a huge amount of text. They do not copy answers from a database. They **generate** answers word by word.'),
          T('How a model is made', '1. **Pre-training**: the model reads huge amounts of text and learns to predict what comes next.\n2. **Fine-tuning**: people and methods (like feedback from humans, and Anthropic\'s Constitutional AI) teach it to be helpful, honest and harmless.\nBigger models with more data and compute tend to get more capable. This is often called **scaling**.'),
          MC('What does "generative" mean in generative AI?', ['It creates new content', 'It only searches the web', 'It stores your files', 'It can only classify images'], 'Generative AI produces new text, images, code and so on.'),
          ORD('Put the steps of making a model like Claude in order', ['Collect a huge amount of text', 'Pre-train: learn to predict the next word', 'Fine-tune to be helpful, honest and harmless', 'Release it for people to use'], 'Pre-training comes first, then fine-tuning, then release.'),

          T('Where it runs', 'Use it in the **terminal**, **VS Code**, **JetBrains** IDEs, the **Claude desktop app**, on the **web** (claude.ai/code), and even on **mobile**.\nThe engine is the same everywhere. Only the interface changes.'),
          MC('What makes Claude Code "agentic"?', ['It can take actions: edit files, run commands, check results', 'It has a nice logo', 'It only answers questions', 'It works offline without a model'], 'Agents act, observe and decide next steps.'),
          MS('Where can you use Claude Code?', ['Terminal', 'VS Code', 'JetBrains IDEs', 'The web (claude.ai/code)'], ['A microwave'], 'Many surfaces, one engine.'),
          TF('Claude Code only sees the one file you have open, like an inline autocomplete.', false, 'It can search and work across the whole project.'),
          PICK('Which task shows Claude Code\'s strength?', 'Complete this one line of code.', 'Find why checkout fails for expired cards, fix it across files, and run the tests.', 1, 'Multi-file investigation and action is where an agent shines.'),

          MS('What can Claude Code access when you run it in a folder?', ['Your project files', 'Your terminal commands', 'Your git state', 'Your CLAUDE.md'], ['Your bank account'], 'It works with your project, terminal, git and memory files.'),

          T('Steer while it works', '- Press **Esc** to stop Claude right away.\n- Type a correction and press Enter: it is **queued** and read after the current step.\n- Press **Shift+Tab** to cycle **permission modes** (Manual, Accept edits, Plan, Auto).'),

          T('When to skip the plan', 'Planning adds overhead. If you could describe the change **in one sentence** (a typo, a log line, a rename), just ask for it directly.\nPlan when you are **unsure of the approach**, the change touches **many files**, or the code is **new to you**.'),

          FB('Press ___ to open Claude\'s plan in your text editor.', ['Ctrl+G', 'Ctrl+P', 'Esc'], 'Ctrl+G lets you edit the plan directly.'),

/* ---------------- Learn: the path ---------------- */
const OFFS = [0, 46, 74, 46, 0, -46, -74, -46];
function renderPath() {
  const cur = currentIndex();
  let html = '<div class="page">';
  for (const s of SECTIONS) {
    const sp = sectionProgress(s);
    html += `<div class="section-head" id="sec-${s.id}" style="--sec:${s.color};--sec-d:${s.dark}">
      <div class="grow"><div class="num">Section ${s.index + 1} · ${plural(s.units.length, 'unit')}</div><h2>${esc(s.title)}</h2><div class="meta">${esc(s.desc)}</div></div>
      <div class="ring">${ring(sp.done / sp.total, s.color, 48)}</div></div>`;
    for (const u of s.units) {
      const unitOpen = u.start <= cur || u.start < S.skipUntil;
      const uiIdx = s.units.indexOf(u) + 1;
      html += `<div style="--sec:${s.color};--sec-d:${s.dark}">
        <div class="unit-banner"><div class="unit-card ${unitOpen ? '' : 'locked'}">
          <div class="grow"><div class="eyebrow">Section ${s.index + 1}, Unit ${uiIdx}</div><h3>${esc(u.title)}</h3><div class="src">${esc(COURSES[u.course].name)}</div></div>
          <button class="gb" data-act="guide" data-id="${u.id}" aria-label="Guidebook for ${esc(u.title)}">${I.book}<span>Guide</span></button>
        </div></div>`;
      if (!unitOpen) html += `<div class="jump"><button data-act="jump" data-id="${u.id}">Jump here?</button></div>`;
      html += '<div class="path">';
      u.nodes.forEach((n, i) => {
        const st = nodeState(n, cur);
        const off = OFFS[i % OFFS.length];
        const icon = n.type === 'chest' ? chestNode(st) : n.type === 'review' ? I.trophy : n.type === 'quiz' ? I.medal : st === 'done' ? I.check : st === 'locked' ? I.lock : I.star;
        const cls = n.type === 'chest' ? 'chest' : st;
        const isLast = cur >= IDX.nodes.length && n.gi === IDX.nodes.length - 1;
        html += `<div class="node-wrap ${st === 'current' ? 'is-current' : ''} ${isLast ? 'is-last' : ''} ${ui.pop === n.gi ? 'has-pop' : ''}" style="transform:translateX(${off}px)">
          ${st === 'current' ? `<div class="start-tip">${n.type === 'lesson' ? 'Start' : n.type === 'review' ? 'Review' : n.type === 'chest' ? 'Open me' : 'Quiz'}</div>` : ''}
          ${st === 'current' && n.type === 'lesson' ? `<svg class="node-ring" viewBox="0 0 96 96"><circle cx="48" cy="48" r="44" fill="none" stroke="var(--line)" stroke-width="7"/></svg>` : ''}
          <button class="node ${cls} ${st === 'locked' ? 'locked' : ''}" data-act="node" data-gi="${n.gi}" aria-label="${esc(nodeLabel(n))}, ${st}">${icon}</button>
          ${ui.pop === n.gi ? renderPopover(n, st, off) : ''}
        </div>`;
        if (i === 2 && u.nodes.length > 4) html += `<div style="height:0;position:relative;width:100%"><div class="pip-side" style="top:-120px;${off >= 0 ? 'left:6%' : 'right:6%'}">${pip(st === 'locked' ? 'happy' : 'cheer', 'pipsvg')}</div></div>`;
      });
      html += '</div></div>';
    }
  }
  html += `<div class="path-end">${pip('cheer', 'pip')}<p style="margin-top:8px">You reached the end of the path. You know Claude!<br>Keep your streak with Practice.</p><p class="fine">Unofficial study game. Content is based on Claude Academy (academy.claude.com) and the public Claude docs. Not made by Anthropic.</p></div></div>`;
  return html;
}
function chestNode(st) {
  if (st === 'done' || st === 'skipped') return chestSvg(true);
  const locked = st === 'locked';
  return chestSvg(false).replace('VAR1', locked ? 'var(--locked-d)' : '#c97b2b').replace('VAR2', locked ? 'var(--locked)' : '#e0943a').replace(/VAR3/g, locked ? 'var(--locked-d)' : '#a8621e').replace('VAR4', locked ? 'var(--locked-ink)' : '#ffc800');
}
function nodeLabel(n) {
  if (n.type === 'lesson') return n.lesson.title;
  if (n.type === 'chest') return 'Treasure chest';
  if (n.type === 'review') return n.unit.title + ': unit review';
  return COURSES[n.course].name + ': course quiz';
}
function renderPopover(n, st, off) {
  const locked = st === 'locked';
  let title = nodeLabel(n), text = '', btn = '';
  if (n.type === 'lesson') {
    text = 'Lesson ' + n.lesson.num + ' of ' + n.unit.lessons.length + ' · ' + n.lesson.items.filter((i) => i.k !== 't').length + ' questions';
    btn = locked ? 'Locked' : st === 'done' ? 'Practice +5 XP' : 'Start +10 XP';
  } else if (n.type === 'review') {
    text = 'Mixed questions from this unit. Finish with no mistakes to make it Legendary.';
    btn = locked ? 'Locked' : st === 'done' ? 'Go legendary' : 'Start review +15 XP';
  } else if (n.type === 'quiz') {
    text = 'Final quiz for this course. Score 80% or more to earn the course badge.';
    btn = locked ? 'Locked' : st === 'done' ? 'Retake quiz' : 'Take the quiz +20 XP';
  } else { text = 'A chest full of gems.'; btn = locked ? 'Locked' : st === 'done' ? 'Opened' : 'Open'; }
  if (locked) text = 'Complete all the levels above to unlock this.';
  return `<div class="popover ${locked ? 'locked' : ''}" role="dialog" style="--off:${off || 0}px"><h4>${esc(title)}</h4><p>${esc(text)}</p>
    <button class="btn" data-act="go" data-gi="${n.gi}" ${locked || (n.type === 'chest' && st === 'done') ? 'disabled' : ''}>${esc(btn)}</button></div>`;
}
function ring(frac, color, size) {
  const r = size / 2 - 5, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - clamp(frac, 0, 1))}" transform="rotate(-90 ${size / 2} ${size / 2})"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="${frac >= 1 ? 10 : 12}" font-weight="800" fill="var(--muted)">${Math.round(frac * 100)}%</text></svg>`;
}

/* ---------------- Practice tab ---------------- */
function seenQuestions() {
  return Object.entries(S.qs).filter(([id]) => IDX.q[id]).map(([id, v]) => ({ id, box: v[0], ok: v[1], bad: v[2], t: v[3] }));
}
function mistakePool() { return seenQuestions().filter((q) => q.box === 0 && q.bad > 0).sort((a, b) => b.t - a.t).map((q) => IDX.q[q.id]); }
function weakPool() { return seenQuestions().filter((q) => q.ok + q.bad >= 1).sort((a, b) => (a.ok / (a.ok + a.bad) - b.ok / (b.ok + b.bad)) || (a.box - b.box)).map((q) => IDX.q[q.id]); }
function learnedPool() {
  const ls = Object.values(IDX.lessons).filter((l) => S.done[l.id]);

}

/* ---------------- sessions ---------------- */
/* kinds: lesson | review | quiz | practice | timed | jump */
function startSession(kind, opts) {
  let items = [], title = '', lives = null, timer = null;
  if (kind === 'lesson') { items = opts.lesson.items.slice(); title = opts.lesson.title; }
  else if (kind === 'review') { items = pickQuestions(questionsOf(opts.unit.lessons), 12, true); title = opts.unit.title + ' review'; }
  else if (kind === 'quiz') { items = pickSpread(courseLessons(opts.course), 12); title = COURSES[opts.course].name + ' quiz'; }
  else if (kind === 'jump') { items = pickQuestions(questionsOf(opts.unit.lessons), 10, true); title = 'Jump to ' + opts.unit.title; lives = 3; }
  else if (kind === 'practice') { items = opts.items.slice(0, 10); title = opts.title; }
  else if (kind === 'timed') {
    const pool = (learnedPool().length >= 8 ? learnedPool() : questionsOf(IDX.units[0].lessons)).filter((q) => ['mc', 'tf', 'fb', 'pick'].includes(q.k));
    items = shuffle(pool); title = 'Speed Round'; timer = 60;
  }
  if (!items.length) { toast('Nothing to practice yet.'); return; }
  const usesHearts = S.settings.hearts && (kind === 'lesson' || kind === 'review');
  if (usesHearts && S.hearts <= 0) { openHeartsSheet(true); return; }
  ui.sess = {
    kind, opts, title, items, idx: 0, total: items.length, progress: 0, mistakes: 0, combo: 0, bestCombo: 0, correct: 0, answered: 0,
    start: Date.now(), usesHearts, lives, timer, timeLeft: timer, retried: {}, answer: null, phase: 'answer', xp: 0, seen: new Set(),
  };
  ui.pop = null;
  document.body.classList.toggle('reduce', !S.settings.motion);
  mountLesson();
  if (timer) startTimer();
}
function pickQuestions(pool, n, preferHard) {
  const w = { mc: 1, tf: .7, fb: 1.2, pick: 1, match: 1.3, ord: 1.5, ms: 1.6, build: 1.5, type: 1.4 };
  const scored = pool.map((q) => ({ q, s: Math.random() * (preferHard ? (w[q.k] || 1) : 1) }));
  scored.sort((a, b) => b.s - a.s);
  return scored.slice(0, n).map((x) => x.q);
}
function pickSpread(lessons, n) {
  const per = lessons.map((l) => shuffle(l.items.filter((i) => i.k !== 't')));
  const out = []; let round = 0;
  while (out.length < n && per.some((p) => p.length > round)) { for (const p of shuffle(per)) { if (p[round] && out.length < n) out.push(p[round]); } round++; }
  return shuffle(out);
}
function smartPool() {
  const now = Date.now(), DAY = 86400000, gaps = [0, 1, 3, 7, 16, 35];
  const due = seenQuestions().filter((q) => now - q.t >= gaps[Math.min(q.box, gaps.length - 1)] * DAY * 0.9).sort((a, b) => a.box - b.box || a.t - b.t).map((q) => IDX.q[q.id]);
  const extra = shuffle(learnedPool().filter((q) => !S.qs[q.id]));
  return [...due, ...extra];
}

function evaluate() {

  let ok = false, note = '';
  if (it.k === 'mc') ok = st.opts[st.sel] === it.o[0];
  else if (it.k === 'tf') ok = (st.sel === 0) === !!it.a;
  else if (it.k === 'pick') ok = st.order[st.sel] === it.a;
  else if (it.k === 'fb') ok = st.opts[st.pick] === it.o[0];
  else if (it.k === 'ord') ok = st.picked.every((j, n) => st.bank[j].t === it.a[n]);
  else if (it.k === 'build') ok = norm(st.picked.map((j) => st.bank[j].t).join(' ')) === norm(it.a);
  else if (it.k === 'ms') ok = st.opts.every((o, i) => o.ok === st.sel.has(i));
  else if (it.k === 'match') { ok = true; note = st.miss ? 'One slip, but you matched them all.' : ''; }

    ok = it.a.some((x) => norm(x) === a);

    <div class="fb-body">${ok ? (note ? `<div class="ans">${esc(note)}</div>` : '') : `<div>Correct answer:</div><div class="ans">${answerText(it)}</div>`}${it.why ? `<div class="why">${inline(it.why)}</div>` : ''}</div>

    <button class="btn" data-act="next" id="next">Continue</button>`;

}

/* ---------------- finishing ---------------- */
function awardXp(x) {

    S.done[s.opts.lesson.id] = { n: ((S.done[s.opts.lesson.id] || {}).n || 0) + 1, acc, t: Date.now() };
    S.stats.lessons++; S.today.lessons++;

    sub = first ? 'You finished "' + s.opts.lesson.title + '".' : 'Practice makes perfect.';

  } else if (s.kind === 'review') {

/* ---------------- effects ---------------- */
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; app().appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function flushToasts() {
  if (ui.pendingToast) { ui.toasts.push(ui.pendingToast); ui.pendingToast = null; }
  let delay = 0; while (ui.toasts.length) { const m = ui.toasts.shift(); setTimeout(() => toast(m), delay); delay += 2800; }
}
function confetti() {
  const c = document.createElement('canvas'); c.className = 'confetti'; const root = app(); root.appendChild(c);
  const w = c.width = root.clientWidth * devicePixelRatio, h = c.height = root.clientHeight * devicePixelRatio;
  c.style.width = root.clientWidth + 'px'; c.style.height = root.clientHeight + 'px';
  const ctx = c.getContext('2d'); const cols = ['#58cc02', '#1cb0f6', '#ffc800', '#ff4b4b', '#a560f0', '#ff7a3d'];
  const ps = Array.from({ length: 90 }, () => ({ x: w / 2 + (Math.random() - .5) * w * .3, y: h * .35, vx: (Math.random() - .5) * 18 * devicePixelRatio, vy: (-Math.random() * 16 - 6) * devicePixelRatio, s: (5 + Math.random() * 6) * devicePixelRatio, c: pickOne(cols), r: Math.random() * 6, vr: (Math.random() - .5) * .4 }));
  let f = 0;
  (function loop() {
    ctx.clearRect(0, 0, w, h);
    for (const p of ps) { p.x += p.vx; p.y += p.vy; p.vy += .55 * devicePixelRatio; p.vx *= .99; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .66); ctx.restore(); }
    if (++f < 110) requestAnimationFrame(loop); else c.remove();
  })();
}

/* resize to a 256px square JPEG before upload: small, and strips photo location data */
function squareJpeg(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = 256;
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
      URL.revokeObjectURL(url);
      c.toBlob((b) => b ? resolve(b) : reject(new Error('resize')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('not an image')); };
    img.src = url;
  });
}

    const path = net.uid + '/avatar-' + Date.now() + '.jpg';
    const up = await net.sb.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
    if (up.error) throw up.error;
    const old = net.me && net.me.avatar_path;
    const { error } = await net.sb.from('profiles').update({ avatar_path: path }).eq('id', net.uid);
    if (error) throw error;
    if (old && old !== path) net.sb.storage.from('avatars').remove([old]);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) flushSave();

  });
  window.addEventListener('pagehide', flushSave);
  window.addEventListener('blur', flushSave);
  setInterval(() => { if (!ui.sess && !ui.sheet && ui.ready) { const before = S.hearts; tick(); if (S.hearts !== before) render(); } }, 60000);
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ tab: ui.tab }));
  if (hot && typeof hot.ready === 'function') hot.ready((data) => { if (data && data.tab) ui.tab = data.tab; boot(); });
  else boot();
} catch (e) { boot(); }
})();
